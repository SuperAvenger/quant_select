[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_a"
version = "0.1.0"
description = "A-share event-driven backtest framework using TuShare Pro"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "PyYAML>=6.0",
  "tushare>=1.2.89",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
